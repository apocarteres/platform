name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Проверка документации и сводок
        run: |
          node --test packages/project-conventions/test/*.test.mjs
          node packages/project-conventions/bin/conventions.mjs docs-check

  conventions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Тесты пакета правил
        run: node --test packages/project-conventions/test/*.test.mjs
      - name: Правила соблюдаются в самом ядре
        run: node packages/project-conventions/bin/conventions.mjs check

  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Сборка и тесты
        run: ./mvnw --batch-mode --no-transfer-progress verify

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.90.8
        with:
          extra_args: --results=verified,unknown
