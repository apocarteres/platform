# Версии инструментов пока не закреплены: см. открытый вопрос о выравнивании
# версий Node у потребителей в docs/decisions/ADR-0001-shared-core.md.

[tasks.docs-test]
description = "Тесты инструментов проверки документации"
run = "node --test scripts/docs/*.test.mjs"

[tasks.docs-check]
description = "Проверить метаданные, ссылки и сводки документации"
depends = ["docs-test"]
run = ["node scripts/docs/check-docs.mjs", "node scripts/docs/tickets-index.mjs --check", "node scripts/docs/releases-index.mjs --check"]

[tasks.tickets-index]
description = "Собрать сводки задач из метаданных"
run = "node scripts/docs/tickets-index.mjs"

[tasks.releases-index]
description = "Собрать каталог выпусков"
run = "node scripts/docs/releases-index.mjs"

[tasks.conventions-check]
description = "Проверить правила проекта: комментарии и блок правил в AGENTS.md"
run = "node packages/project-conventions/bin/conventions.mjs check"

[tasks.conventions-sync]
description = "Вписать блок правил в AGENTS.md"
run = "node packages/project-conventions/bin/conventions.mjs sync"

[tasks.conventions-baseline]
description = "Зафиксировать существующие комментарии храповиком"
run = "node packages/project-conventions/bin/conventions.mjs baseline \"$@\""

[tasks.conventions-test]
description = "Тесты пакета правил"
dir = "packages/project-conventions"
run = "node --test test/*.test.mjs"

[tasks.java-build]
description = "Собрать Java-модули без тестов"
run = "./mvnw --batch-mode --no-transfer-progress -DskipTests package"

[tasks.java-test]
description = "Тесты Java-модулей"
run = "./mvnw --batch-mode --no-transfer-progress verify"

[tasks.build]
description = "Проверить документацию и собрать Java-модули с тестами"
depends = ["docs-check", "conventions-test", "conventions-check", "java-test"]
