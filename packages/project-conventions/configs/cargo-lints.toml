# REQ-QUALITY-002
# Раздел, который крейт потребителя вносит в свой Cargo.toml: разбор роняет
# сборку на предупреждениях, как того требует REQ-QUALITY-002.
#
# Это пол, а не потолок. Набор `pedantic` сюда намеренно не входит: вместе с
# `warnings = "deny"` он делает отказом обычный код — например требует
# `#[must_use]` у всякой чистой функции. Проект волен включить его сверх этого
# набора, засеяв находки ограничителем (REQ-QUALITY-007).
#
# Послабления для тестового кода объявляются отдельно и в рабочий код не
# проникают (REQ-QUALITY-006).

[lints.rust]
warnings = "deny"
# `deny`, а не `forbid`: `forbid` нельзя снять объявленным послаблением по месту,
# и обоснованный единичный `unsafe` — обработчик сигнала через libc, которому нет
# безопасной обёртки в зависимостях, — становится непроходимым. Тот же довод, по
# которому из набора убран `pedantic`. Послабление видно в коде и попадает под
# ограничитель множеством (REQ-QUALITY-007).
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
