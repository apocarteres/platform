# REQ-BUILD-004: версии инструментов закреплены и совпадают с версиями потребителя.
[tools]
java = "25"
node = "22.22.3"
npm = "10.9.4"


[tasks.docs-check]
description = "Проверить метаданные, ссылки и сводки документации"
depends = ["conventions-test"]
run = "node packages/project-conventions/bin/conventions.mjs docs-check"

[tasks.tickets-index]
description = "Собрать сводки задач из метаданных"
run = "node packages/project-conventions/bin/conventions.mjs tickets-index"

[tasks.releases-index]
description = "Собрать каталог выпусков"
run = "node packages/project-conventions/bin/conventions.mjs releases-index"

[tasks.conventions-check]
description = "Проверить правила проекта: комментарии и блок правил в AGENTS.md"
run = "node packages/project-conventions/bin/conventions.mjs check"

[tasks.conventions-sync]
description = "Вписать блок правил в AGENTS.md"
run = "node packages/project-conventions/bin/conventions.mjs sync"

[tasks.conventions-baseline]
description = "Зафиксировать существующие комментарии храповиком"
run = "node packages/project-conventions/bin/conventions.mjs baseline \"$@\""

[tasks.conventions-test]
description = "Тесты пакета правил"
dir = "packages/project-conventions"
run = "node --test test/*.test.mjs"

[tasks.web-test]
description = "Модульные тесты npm-пакетов ядра"
run = "scripts/web.sh test"

[tasks.web-typecheck]
description = "Проверка типов npm-пакетов ядра"
run = "scripts/web.sh typecheck"

[tasks.web-build]
description = "Сборка npm-пакетов ядра, которым нужна сборка"
run = "scripts/web.sh build"

[tasks.java-build]
description = "Собрать Java-модули без тестов"
run = "./mvnw --batch-mode --no-transfer-progress -DskipTests package"

[tasks.java-test]
description = "Тесты Java-модулей"
run = "./mvnw --batch-mode --no-transfer-progress verify"

[tasks.install-local]
description = "Опубликовать ядро локально: Maven в ~/.m2, npm-архив в target/local-packages"
run = "scripts/install-local.sh \"$@\""

[tasks.check]
description = "Быстрый шлагбаум перед отправкой: документация, правила, тесты пакета и Java-модулей"
run = [
  "mise run docs-check",
  "mise run conventions-check",
  "mise run web-typecheck",
  "mise run web-test",
  "mise run java-test",
]

[tasks.verify-set]
description = "Полный набор: быстрый шлагбаум и сборка npm-пакетов ядра"
run = [
  "mise run check",
  "mise run web-build",
]

[tasks.verify]
description = "Всё, что проверяется локально; расписку пишет наблюдавший прогон"
run = "node packages/project-conventions/bin/conventions.mjs receipt --checks check,verify -- mise run verify-set"

[tasks.release]
description = "Закрыть выпуск: проверки, тег на проверенном коммите, публикация артефактов, отметка завершающего шага"
run = [
  "mise run verify",
  "node packages/project-conventions/bin/conventions.mjs release close",
  "mise run install-local",
  "node packages/project-conventions/bin/conventions.mjs release finish --note \"публикация артефактов ядра: mise run install-local\"",
]

[tasks.release-open]
description = "Открыть выпуск: номер и перечень задач. Пример: mise run release-open 1.2.0 CORE-OPS-023,CORE-OPS-024"
usage = """
arg "<version>" help="Номер выпуска"
arg "<tickets>" help="Задачи в состав, через запятую"
"""
run = "node packages/project-conventions/bin/conventions.mjs release open --version $usage_version --tickets $usage_tickets"

[tasks.install-hooks]
description = "Поставить хук pre-push, выполняющий быстрый шлагбаум"
run = "scripts/git-hooks/install.sh"
