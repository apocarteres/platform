name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Проверка документации и сводок
        run: |
          node --test scripts/docs/*.test.mjs
          node scripts/docs/check-docs.mjs
          node scripts/docs/tickets-index.mjs --check
          node scripts/docs/releases-index.mjs --check

  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Сборка и тесты
        run: ./mvnw --batch-mode --no-transfer-progress verify

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.90.8
        with:
          extra_args: --results=verified,unknown
